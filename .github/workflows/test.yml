name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # import_contract! and register_import! resolve `xoxno/controller` on
      # testnet at build time, from the dry-run registry root.
      STELLAR_NETWORK: testnet
      STELLAR_REGISTRY_CONTRACT_ID: CC26C2PEXKLYI2Z5ZX3WMMERJ6XZPF4D2C4VNSFW2EYYRKPRZFWOYUJ6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked
