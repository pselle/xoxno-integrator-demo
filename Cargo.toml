[package]
name = "xoxno-health-check"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"
stellar-registry = "0.1.4"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
stellar-registry = { version = "0.1.4", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
