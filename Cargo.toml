[package]
name = "xoxno-health-check"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"
# register_import! landed in stellar-registry/cli#77 but isn't released yet.
stellar-registry = { git = "https://github.com/stellar-registry/cli", rev = "fa49d9974b7d561c21705a8dbab331f4513c9560" }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
stellar-registry = { git = "https://github.com/stellar-registry/cli", rev = "fa49d9974b7d561c21705a8dbab331f4513c9560", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
